name: hj-tech-radar

# 日志轮转：json-file 驱动默认无上限，长期运行会撑爆宿主机磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- 数据层 ----------
  postgres:
    image: pgvector/pgvector:pg16
    # 小数据量（双来源、库 <100MB）下 64MB shared_buffers 足够：为 3.5G 内存
    # 服务器预留余量（2026-10-14 内存优化），默认 128MB 在此规模无收益
    command: ["postgres", "-c", "shared_buffers=64MB"]
    environment:
      POSTGRES_USER: hjradar
      # 口令从根目录 .env 强制注入（缺失直接报错拒起，2026-09-18 审计整改 F-5：
      # 移除 :-hjradar 默认回退，杜绝忘配口令时静默用弱口令建库）；
      # 已有卷换口令需 ALTER USER + 同步 backend/.env，检查单见 .env.example
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在项目根目录 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: hjradar
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不向宿主机发布端口：仅容器网络内可达；临时调试用
    # docker compose exec postgres psql -U hjradar -d hjradar
    restart: unless-stopped  # 数据层必须自愈：宿主机重启后整栈才能自动拉起
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hjradar -d hjradar"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped  # 与 postgres 同理：数据层自愈是全栈拉起的前置
    volumes:
      - redisdata:/data
    # noeviction：broker 满时写入报错而非静默丢任务；64MB 远高于日常 ~12MB
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000",
              "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # glibc 每线程 malloc 竞态区上限（默认 8×核数）：压 Python 常驻服务 RSS
      MALLOC_ARENA_MAX: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 仅绑定本机回环：公网入口统一走 nginx(80)，避免管理接口直接暴露
      - "127.0.0.1:18000:8000"
    restart: unless-stopped
    # slim 镜像无 curl，用 python 标准库探活（顺带验证 DB 连路——/health 查库）
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # ---------- 任务队列 ----------
  worker:        # 默认队列：事件聚合 / 日报 + 内嵌 beat 定时调度
    build: ./backend
    env_file: ./backend/.env
    environment:
      MALLOC_ARENA_MAX: "2"
    # max-tasks-per-child：numpy/jieba 等库的内存碎片随任务数累积，定期回收进程。
    # --beat 内嵌调度器（2026-10-14 内存优化）：省掉独立 beat 容器（约 160MB），
    #   3.5G 内存服务器单 worker 承担调度 + 消费；调度文件落 /tmp（F-2 非 root 只读 /srv）
    # -c 2：双来源采集量下并发 4 无收益，砍半省 ~100MB
    command: celery -A app.tasks.celery_app worker -Q default -c 2 --beat --loglevel=INFO
      --max-tasks-per-child=100 --schedule=/tmp/celerybeat-schedule
    # 依赖 backend healthy：表结构由 backend 启动时的 init_db 建立，
    # 首启窗口任务（event/stats 消费）不再打在空库上
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    # worker 名默认为 celery@<容器主机名>；无应答时 celery 以非零码退出
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping --timeout=10 -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    logging: *default-logging

  ai-worker:     # AI 队列：摘要 / Embedding
    build: ./backend
    env_file: ./backend/.env
    environment:
      MALLOC_ARENA_MAX: "2"
    command: celery -A app.tasks.celery_app worker -Q ai -c 2 --loglevel=INFO --max-tasks-per-child=100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping --timeout=10 -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # ---------- 采集服务 ----------
  crawler:       # 常驻循环：多来源采集（IT之家 / 快科技，crawler/multi.py）→ 入库 → 派发 AI 任务
    build: ./backend
    env_file: ./backend/.env
    environment:
      MALLOC_ARENA_MAX: "2"
    command: python -m app.crawler.loop
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    # 采集循环可能卡死而非崩溃（restart 救不了）：loop 每轮写心跳文件，
    # 超过「当轮间隔 ×3 + 5 分钟」无心跳判为 unhealthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,time,sys,os; p='/tmp/crawler-loop-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-json.load(open(p))['ts'] < (max(1,json.load(open(p)).get('interval_min',30))*3+5)*60 else 1)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5m
    logging: *default-logging

  # ---------- 前端 + Nginx ----------
  nginx:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 仅绑回环（2026-09-18 审计整改 M-1）：单机部署收紧局域网暴露面；
      # 需要局域网共享（手机/其他设备访问）时在 docker-compose.override.yml 里
      # 给 nginx 加 ports: ["80:80"] 覆盖，用完移除（见 README 安全须知）
      - "127.0.0.1:80:80"
    restart: unless-stopped
    # 探活走本机反代链路：nginx → backend → /health，代理断了也能暴露
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v2/health || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
