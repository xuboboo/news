# API 按 IP 限流：正常前端每客户端约 3 请求/分钟（60s 轮询 3 个接口），
# 10r/s + burst 20 对真人余量充足，脚本高频刷库在 nginx 挡下（429），
# 不再透传到后端触发全窗口扫描查询
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# 公开内容出口限流（/api/v2/feed/ 与 /api/v2/agent/）：读者是订阅器与 Agent，
# 单请求是无状态小 XML，1r/s + burst 30 支撑常规订阅轮询且不占业务 API 配额；
# 出口内容另带 ETag/Cache-Control，礼貌客户端命中 304 不消耗桶
limit_req_zone $binary_remote_addr zone=feed_limit:10m rate=1r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（注意 nginx 继承规则：location 内出现任何 add_header 后，
    # 本级 add_header 不再下发，故声明了自有 add_header 的 location 需重复这几条）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 强制模式（2026-09-19 上线前由 Report-Only 切换：观察模式没配 report-uri，
    # 收集不到任何违规数据，等于空转）。前端零外部依赖：主题脚本已外置 theme-init.js、
    # 无 CDN 脚本/外链图片（连 <img> 都没有），img-src 相应收紧为 'self' data:
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 动态解析 upstream：nginx 仅在启动时解析一次静态 upstream 域名，backend 容器
    # 重建换 IP 后旧 IP 缓存导致 502（2026-09-09 运维实录）。变量式 proxy_pass +
    # resolver 让每个请求周期性重解析，重建后端不再需要连带重启 nginx
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8000;

    # JS/CSS/JSON/SVG 压缩传输（基础镜像默认只压 text/html）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 静态资源长缓存（文件名带 hash，可变更文件不要放这里）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # nginx 继承规则：本 location 声明了自有 add_header 后须补齐 CSP（与 server 级一致）
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # 公开内容出口（public_exports_enabled 开关总控，默认 404）：独立低速率限流，
    # 最长前缀匹配优先于下方 /api/ 通配
    location /api/v2/feed/ {
        limit_req zone=feed_limit burst=30 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location /api/v2/agent/ {
        limit_req zone=feed_limit burst=30 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # llms.txt 约定俗成在站点根路径（Agent 按惯例直接请求 /llms.txt）；
    # 后端按 public_exports_enabled 开关决定 200/404，robots.txt 走前端静态资源
    location = /llms.txt {
        limit_req zone=feed_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream/api/v2/agent/llms.txt;
        proxy_set_header Host $host;
    }

    # 后端 API 反向代理
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆写而非 $proxy_add_x_forwarded_for（追加语义）：否则客户端可伪造 XFF 首段，
        # 后端审计日志的 IP 取值全量失真（2026-09-09 审计修复）
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    # FastAPI 文档不再经 nginx 透出（2026-09-19 生产加固）：ENABLE_DOCS=false 时后端
    # 本就 404，此 location 属多余暴露面；内网调试直接走后端回环口
    # http://127.0.0.1:18000/docs（见根 README 端口表）

    # 入口页禁止缓存：部署窗口内保证拿到新 index.html，避免引用已清理的旧 hash 资源而白屏
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # 前端 SPA（缺失路径回退 index.html，经内部重写命中上面的 no-cache 规则）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
