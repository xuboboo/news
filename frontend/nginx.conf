server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（注意 nginx 继承规则：location 内出现任何 add_header 后，
    # 本级 add_header 不再下发，故声明了自有 add_header 的 location 需重复这三条）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # JS/CSS/JSON/SVG 压缩传输（基础镜像默认只压 text/html）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 静态资源长缓存（文件名带 hash，可变更文件不要放这里）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # FastAPI 文档（可选透出）
    location ~ ^/(docs|openapi.json|redoc) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # 入口页禁止缓存：部署窗口内保证拿到新 index.html，避免引用已清理的旧 hash 资源而白屏
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 前端 SPA（缺失路径回退 index.html，经内部重写命中上面的 no-cache 规则）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
