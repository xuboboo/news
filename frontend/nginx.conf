server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（注意 nginx 继承规则：location 内出现任何 add_header 后，
    # 本级 add_header 不再下发，故声明了自有 add_header 的 location 需重复这几条）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 观察模式（Report-Only 只上报不拦截）：先收集违规再逐步收紧为强制 CSP
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 动态解析 upstream：nginx 仅在启动时解析一次静态 upstream 域名，backend 容器
    # 重建换 IP 后旧 IP 缓存导致 502（2026-09-09 运维实录）。变量式 proxy_pass +
    # resolver 让每个请求周期性重解析，重建后端不再需要连带重启 nginx
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8000;

    # JS/CSS/JSON/SVG 压缩传输（基础镜像默认只压 text/html）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 静态资源长缓存（文件名带 hash，可变更文件不要放这里）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # nginx 继承规则：本 location 声明了自有 add_header 后须补齐 CSP（与 server 级一致）
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆写而非 $proxy_add_x_forwarded_for（追加语义）：否则客户端可伪造 XFF 首段，
        # 后端审计日志的 IP 取值全量失真（2026-09-09 审计修复）
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    # FastAPI 文档（可选透出）
    location ~ ^/(docs|openapi.json|redoc) {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # 入口页禁止缓存：部署窗口内保证拿到新 index.html，避免引用已清理的旧 hash 资源而白屏
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # 前端 SPA（缺失路径回退 index.html，经内部重写命中上面的 no-cache 规则）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
