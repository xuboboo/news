<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/radar.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070B14" />
    <meta name="description" content="华军软件园资讯雷达系统 V2.0 — 多源科技资讯聚合与热点分析：热榜中心、最新资讯、AI 摘要、热点事件聚合与今日早报" />
    <title>华军软件园资讯雷达系统 V2.0</title>
    <script>
      // pre-paint 主题解析：首帧渲染前落定 data-theme，避免浅色用户看到深色闪烁（FOUC）。
      // 逻辑须与 src/theme.ts 保持一致（STORAGE_KEY / system 解析 / theme-color 值）。
      (function () {
        try {
          var m = localStorage.getItem('radar-theme');
          // 与 src/theme.ts 对齐：仅显式 'light' 判浅色，'dark' 判深色，
          // 其余（null/'system'/无效值）跟随系统偏好
          var dark =
            m === 'dark' ||
            (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#070B14' : '#F5F5F7');
        } catch (e) {
          /* localStorage 不可用时保持默认深色 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>本系统需要启用 JavaScript 才能使用，请开启后刷新页面。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
