# 最小 CI（2026-09-18 审计整改 M-4）：后端 pytest（离线 SQLite，pg 集成用例
# 无 TEST_DATABASE_URL 时自动 skip）+ 前端类型检查/lint/vitest。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps (prod + dev)
        run: pip install -r requirements-dev.txt
      - name: Pytest
        # CI 无 backend/.env：Settings 走默认值（development），fail-fast 自检不触发
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Vitest
        run: npm test
