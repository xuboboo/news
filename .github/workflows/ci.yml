name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps (prod + dev)
        run: pip install -r requirements-dev.txt
      - name: Pytest (SQLite suite; PG tests run separately)
        run: python -m pytest tests/ -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: radar_test
          POSTGRES_PASSWORD: isolated_test_password
          POSTGRES_DB: radar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar_test -d radar_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://radar_test:isolated_test_password@127.0.0.1:5432/radar_test_business
      TEST_DATABASE_URL: postgresql+psycopg://radar_test:isolated_test_password@127.0.0.1:5432/radar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps (prod + dev)
        run: pip install -r requirements-dev.txt
      - name: Verify PostgreSQL test URL is configured
        run: python -c "import os; assert os.environ.get('TEST_DATABASE_URL'), 'TEST_DATABASE_URL is required'"
      - name: Run PostgreSQL integration tests
        run: python -m pytest tests/test_integration_pg.py tests/test_article_draft_pg.py tests/test_site_article_draft_pg.py -q -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build
